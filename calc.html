<html>
    <head>calculator simulator</head>
    <body>
        <div class="calculator">
            <input type="text" id="display" value="0" />
            <div class="buttons">
                <button type="submit" class="clear" onclick="clearDisplay()">c</button>
                <button type="submit"  onclick="deleteLast()">back</button>
                <button type="submit" class="operator" onclick="appendValue('%')">%</button>
                <button type="submit" class="operator" onclick="appendValue('%')">/</button>
                
                 <button type="submit"  onclick="appendValue('7')">7</button>
                <button type="submit"  onclick="appendValue('8')">8</button>
                <button type="submit" onclick="appendValue('9')">9</button>
                <button type="submit" class="operator" onclick="appendValue('*')">x</button>

                <button type="submit"  onclick="appendValue('4')">4 </button>
                <button type="submit"  onclick="appendValue('5')">5 </button>
                <button type="submit" onclick="appendValue('6')">6</button>
                <button type="submit" class="operator" onclick="appendValue('+')">+</button>

                 <button type="submit"  onclick="appendValue('1')">1</button>
                <button type="submit"  onclick="appendValue('2')">2</button>
                <button type="submit" onclick="appendValue('3')">3</button>
                <button type="submit" class="operator" onclick="appendValue('-')">-</button>

                <button type="submit"  onclick="appendValue('0')">0</button>
                <button type="submit"  onclick="appendValue('.')">.</button>
                <button type="submit" class="calculate" onclick="calculate()">=</button>
            </div>
        </div>
        <script>
        const display=document.getElementById("display");

        function clearDisplay(){
        disp.values="0";
        }

function DeleteLast(){
if(disp.value.length===1)
{
disp.values="0"}
}elseif
{
disp.value=disp.value.slice(0,-1);
}



function appendValue(value)
{
if(disp.value==="0" && !isNaN(value)){
disp.value=value;	
}
else{
disp.value+=value;
}
}


function calculate(){
try{
disp.value=eval(disp.value);
}
catch(error){
disp.value="error";
}
}
        </script>
    </body>
</html>
