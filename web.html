body {
    margin: 0;
    font-family: Arial;
    background-color: white;
}

.container {
    display: grid;
    grid-rows: 10% 30% 30% 20%;
    grid-columns: 100%;
}

.sec1 {
    background-color: blue;
    height: 15vh;
    grid-row: 1/2;
    grid-column: 1/2;
    padding: 10px;
    box-sizing: border-box;
}

.header-left {
    width: 25%;
    display: inline-block;
    text-align: center;
}

.header-middle {
    width: 45%;
    display: inline-block;
    text-align: center;
}

.header-right {
    width: 25%;

    text-align: center;

}

.sec2 {
    background-color: lightblue;
    height: auto;
    grid-row: 2/3;
    grid-column: 1/2;
    text-align: center;
    padding: 15px;
}

.sec3 {
    margin-top: 15px;
    width: 100%;
    padding: 10px;
    background-color: yellow;
    box-sizing: border-box;
    height: 350px;
    grid-row: 3/4;
    grid-column: 1/2;
    overflow: hidden;
}

.slider {
    display: flex;
    width: 500%;
    height: 350px;
    animation: slide 15s infinite;
}

.slider img {
    width: 20%;
    height: 350px;
    object-fit: contain;
}

@keyframes slide {

    0% {
        transform: translateX(0);
    }

    18% {
        transform: translateX(0);
    }

    20% {
        transform: translateX(-20%);
    }

    38% {
        transform: translateX(-20%);
    }

    40% {
        transform: translateX(-40%);
    }

    58% {
        transform: translateX(-40%);
    }

    60% {
        transform: translateX(-60%);
    }

    78% {
        transform: translateX(-60%);
    }

    80% {
        transform: translateX(-80%);
    }

    98% {
        transform: translateX(-80%);
    }

    100% {
        transform: translateX(0);
    }

}

.sec4 {
    height: auto;
    grid-row: 4/5;
    grid-column: 1/2;
    text-align: center;
    padding: 15px;
}

h2 {
    text-align: center;
    color: blue;
}

.categories {
    display: flex;
    justify-content: space-around;
    text-align: center;
    margin: 20px;
}

.category {
    padding: 15px;
}

.category img {
    width: 200px;
    height: 160px;
}

.sec5 {

    padding: 15px;
    grid-row: 5/6;

}

.products {

    text-align: center;
    margin: 20px;
}

.product {
    width: 30%;
    padding: 15px;
    background-color: lightgray;
}

.product img {
    width: 220px;
    height: 190px;
}

.product input {

}

.sec6 {

    height: 20vh;
    grid-row: 6/7;

    box-sizing: border-box;
}

}

</style>
